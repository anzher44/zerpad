name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.49.1
      - run: npx playwright install --with-deps chromium
      - name: USB controller
        run: node test/mock-test.js
      - name: Bluetooth controller
        run: node test/bt-test.js
